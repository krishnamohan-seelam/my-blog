<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | truncate: 160 }}">

  <!-- Google Fonts (preconnect for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">

  <!-- SEO -->
  {% include seo-head.html %}

  <!-- Theme init (must be synchronous to prevent FOUC) -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- WebPushr -->
  <script>(function(w,d,s,id){if(typeof(w.webpushr)!=='undefined')return;w.webpushr=w.webpushr||function(){(w.webpushr.q=w.webpushr.q||[]).push(arguments)};var js,fjs=d.getElementsByTagName(s)[0];js=d.createElement(s);js.id=id;js.src="https://cdn.webpushr.com/app.min.js";fjs.parentNode.appendChild(js);}(window,document,'script','webpushr-jssdk-alternative'));
  webpushr('init','BOVBmIwJcRfc_aUHw1vX2mOw5P9SdESR3VIqpFsVvceGfbcJYGr0bXOO1tkqhrfzmvetU_fMgU2fxE4N_cO3yyw','https://krishnamohan-seelam.github.io/my-blog/webpushr-sw.js','/my-blog/');</script>
</head>

<body>

  <!-- Skip to content -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Header -->
  {% include header.html %}

  <!-- Main -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Search Modal -->
  {% include search-modal.html %}

  <!-- JS: Theme toggle + hamburger (deferred) -->
  <script defer src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>

  <!-- JS: Simple Jekyll Search + Setup -->
  <script defer src="{{ '/assets/js/vendor/simple-jekyll-search.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/search-setup.js' | relative_url }}"></script>

</body>
</html>
