<div id="search-modal" class="search-modal" aria-hidden="true" role="dialog" aria-labelledby="search-modal-title">
  <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
  <div class="search-modal-container">
    <div class="search-modal-header">
      <h2 id="search-modal-title" class="sr-only">Search Posts</h2>
      <div class="search-input-wrapper">
        <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search by title, tags, or excerpt..." autocomplete="off" aria-label="Search posts">
      </div>
      <button id="search-modal-close" class="search-modal-close" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="search-modal-body">
      <ul id="results-container" class="search-results-list"></ul>
    </div>
  </div>
</div>
