{% comment %}
  toc.html — Table of Contents
  Generated by JS (toc-scrollspy.js) from article headings.
  This file renders the container elements; JS populates the lists.
{% endcomment %}

{% assign heading_count = page.content | split: '<h2' | size | minus: 1 %}
{% assign h3_count = page.content | split: '<h3' | size | minus: 1 %}
{% assign total_headings = heading_count | plus: h3_count %}

{% if total_headings >= 3 and page.toc != false %}

<!-- Desktop TOC (sticky) -->
<div class="toc-panel" aria-label="Table of contents" id="toc-desktop">
  <span class="toc-label">Contents</span>
  <ul class="toc-list" id="toc-list-desktop" role="list">
    <!-- Populated by toc-scrollspy.js -->
  </ul>
</div>

<!-- Mobile TOC (collapsible, shown above article) -->
<div class="toc-mobile">
  <button class="toc-mobile__toggle"
          aria-expanded="false"
          aria-controls="toc-mobile-content">
    <span>Table of Contents</span>
    <span class="toc-arrow" aria-hidden="true">▾</span>
  </button>
  <div class="toc-mobile__content" id="toc-mobile-content">
    <ul class="toc-list" id="toc-list-mobile" role="list">
      <!-- Populated by toc-scrollspy.js -->
    </ul>
  </div>
</div>

{% endif %}
